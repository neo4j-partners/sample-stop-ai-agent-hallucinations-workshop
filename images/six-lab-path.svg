<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The six-lab path from raw documents to a deployed agent">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606A"/></marker><marker id="arrowlong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2328"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t{font-size:12px;font-weight:600;fill:#1F2328}.d{font-size:9.5px;fill:#57606A}.n{font-size:11px;font-weight:700}.cap{font-size:11.5px;font-weight:600;fill:#1F2328}.lg{font-size:11px;fill:#57606A}.pk{font-size:9px;font-weight:700;letter-spacing:.4px}.ax{font-size:9.5px;fill:#57606A}</style>
<rect width="1200" height="470" fill="#FFFFFF"/>
<text class="cap" x="28" y="42">Raw documents</text>
<text class="cap" x="1172" y="42" text-anchor="end">Deployed agent</text>
<line x1="136" y1="38" x2="1066" y2="38" stroke="#1F2328" stroke-width="1.2" marker-end="url(#arrowlong)" opacity="0.55"/>
<rect x="28" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<circle cx="48" cy="113" r="11" fill="#4581C3" opacity="0.85"/>
<text class="n" x="48" y="117" text-anchor="middle" fill="#FFFFFF">0</text>
<text class="t" x="64" y="118">Setup</text>
<text class="d" x="40" y="146">Aura + Bedrock</text>
<text class="d" x="40" y="159">one repo-root .env</text>
<line x1="174" y1="151" x2="192" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="195" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#4581C3" stroke-width="2.2"/>
<circle cx="215" cy="113" r="11" fill="#4581C3" opacity="1"/>
<text class="n" x="215" y="117" text-anchor="middle" fill="#FFFFFF">1</text>
<text class="t" x="231" y="118">Graph build</text>
<text class="d" x="207" y="146">Hotel knowledge graph</text>
<text class="d" x="207" y="159">vector + full-text</text>
<text class="pk" x="207" y="198" fill="#4581C3">FIRST PEAK</text>
<line x1="341" y1="151" x2="359" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="362" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<circle cx="382" cy="113" r="11" fill="#4581C3" opacity="0.85"/>
<text class="n" x="382" y="117" text-anchor="middle" fill="#FFFFFF">2</text>
<text class="t" x="398" y="118">Retrieval</text>
<text class="d" x="374" y="146">Four retrievers,</text>
<text class="d" x="374" y="159">same questions</text>
<line x1="508" y1="151" x2="526" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="529" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<circle cx="549" cy="113" r="11" fill="#4581C3" opacity="0.85"/>
<text class="n" x="549" y="117" text-anchor="middle" fill="#FFFFFF">3</text>
<text class="t" x="565" y="118">Agents and tools</text>
<text class="d" x="541" y="146">Agent, tools, hooks,</text>
<text class="d" x="541" y="159">swarms</text>
<line x1="675" y1="151" x2="693" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="696" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
<circle cx="716" cy="113" r="11" fill="#4581C3" opacity="0.85"/>
<text class="n" x="716" y="117" text-anchor="middle" fill="#FFFFFF">4</text>
<text class="t" x="732" y="118">Grounded write</text>
<text class="d" x="708" y="146">Idempotent write,</text>
<text class="d" x="708" y="159">graph rule refuses</text>
<line x1="842" y1="151" x2="860" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="863" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#FF9900" stroke-width="2.2"/>
<circle cx="883" cy="113" r="11" fill="#FF9900" opacity="1"/>
<text class="n" x="883" y="117" text-anchor="middle" fill="#FFFFFF">5</text>
<text class="t" x="899" y="118">AgentCore deploy</text>
<text class="d" x="875" y="146">AgentCore Runtime,</text>
<text class="d" x="875" y="159">retriever unchanged</text>
<text class="pk" x="875" y="198" fill="#FF9900">HIGHER PEAK</text>
<line x1="1009" y1="151" x2="1027" y2="151" stroke="#57606A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="1030" y="92" width="142" height="118" rx="9" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1" stroke-dasharray="5 4"/>
<circle cx="1050" cy="113" r="11" fill="#4581C3" opacity="0.85"/>
<text class="n" x="1050" y="117" text-anchor="middle" fill="#FFFFFF">6</text>
<text class="t" x="1066" y="118">Agent memory</text>
<text class="d" x="1042" y="146">Memory with</text>
<text class="d" x="1042" y="159">provenance</text>
<text class="pk" x="1042" y="198" fill="#57606A">OPTIONAL</text>
<line x1="28" y1="348" x2="1172" y2="348" stroke="#D0D7DE" stroke-width="1"/>
<text class="ax" x="28" y="256">Platform weight</text>
<rect x="72" y="340" width="24" height="8" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="102" y="340" width="24" height="8" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="239" y="284" width="24" height="64" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="269" y="284" width="24" height="64" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="406" y="280" width="24" height="68" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="436" y="326" width="24" height="22" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="573" y="306" width="24" height="42" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="603" y="316" width="24" height="32" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="740" y="284" width="24" height="64" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="770" y="322" width="24" height="26" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="907" y="290" width="24" height="58" rx="2.5" fill="#4581C3" opacity="0.9"/>
<rect x="937" y="268" width="24" height="80" rx="2.5" fill="#FF9900" opacity="0.9"/>
<rect x="1074" y="300" width="24" height="48" rx="2.5" fill="#4581C3" opacity="0.45"/>
<rect x="1104" y="330" width="24" height="18" rx="2.5" fill="#FF9900" opacity="0.45"/>
<rect x="28" y="391" width="11" height="11" rx="2.5" fill="#4581C3"/>
<text class="lg" x="46" y="400">Neo4j: the connected data</text>
<rect x="206" y="391" width="11" height="11" rx="2.5" fill="#FF9900"/>
<text class="lg" x="224" y="400">AWS: reasoning and hosting</text>
<text class="lg" x="1172" y="400" text-anchor="end">Bar height is platform weight. The partnership peaks at Lab 1, then higher at Lab 5.</text>
<text class="lg" x="28" y="424">Labs run in order. Only Lab 6 is optional.</text>
<text class="lg" x="1172" y="424" text-anchor="end">The Lab 2 retriever is the same code in Labs 3, 4, and 5.</text>
</svg>
